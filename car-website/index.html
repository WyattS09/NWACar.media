<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NWACar.Media — Automotive photography from Northwest Arkansas.">
  <title>NWACar.Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">NWACar.Media</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-content">
      <h1>Automotive Photography</h1>
      <p>Real Pictures. Real People. Real Machines.</p>
    </div>
  </header>

  <main class="album-grid" id="album-grid"></main>

  <footer>
    <p>© 2025 NWACar.Media</p>
  </footer>

  <script src="albums.js"></script>
  <script>
    /* ── Album grid ── */
    const grid = document.getElementById("album-grid");

    Object.keys(albums).forEach(key => {
      const album = albums[key];

      const link = document.createElement("a");
      link.href = `album.html?album=${key}`;
      link.className = "album-card";

      const img = document.createElement("img");
      img.src = `${album.path}grid/${album.thumbnail}`;
      img.alt = album.title;
      img.className = "album-card-img";
      img.loading = "lazy";

      const title = document.createElement("div");
      title.className = "album-title";
      title.textContent = album.title;

      link.appendChild(img);
      link.appendChild(title);
      grid.appendChild(link);
    });

    /* ── Hero particle animation ── */
    (function () {
      const canvas = document.getElementById("hero-canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      const COUNT = 60;

      function resize() {
        canvas.width  = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x:  rand(0, canvas.width),
            y:  rand(0, canvas.height),
            vx: rand(-0.15, 0.15),
            vy: rand(-0.15, 0.15),
            r:  rand(1, 2.5),
          });
        }
      }

      function drawLines() {
        const maxDist = 120;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < maxDist) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(255,255,255,${0.06 * (1 - dist / maxDist)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
      }

      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height)  p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.25)";
          ctx.fill();
        }

        drawLines();
        requestAnimationFrame(tick);
      }

      resize();
      initParticles();
      tick();

      window.addEventListener("resize", () => {
        resize();
        initParticles();
      });
    })();
  </script>

</body>
</html>
