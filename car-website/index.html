<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Photography Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">NWACar.Media</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>Automotive Photography</h1>
    <p>Real Pictures. Real People. Real Machines.</p>
  </header>

  <main class="album-grid" id="album-grid"></main>

  <script src="albums.js"></script>
  <script>
    const grid = document.getElementById("album-grid");
  
    Object.keys(albums).forEach(key => {
      const album = albums[key];
  
      const link = document.createElement("a");
      link.href = `album.html?album=${key}`;
      link.className = "album-card";
  
      link.innerHTML = `
        <img src="${album.path}thumb.jpeg" alt="${album.title}">
        <div class="album-title">${album.title}</div>
      `;
  
      grid.appendChild(link);
    });
  </script>

  </main>

  <footer>
    <p>© 2025 Car Visuals</p>
  </footer>

</body>
</html>
