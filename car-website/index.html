<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NWACar.Media — Automotive photography from Northwest Arkansas.">
  <title>NWACar.Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">NWACar.Media</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="hero">
    <!--
      HERO IMAGES: create an images/hero/ folder and add your
      best shots. Rename the files below to match, or change
      the filenames here. Add or remove .hero-slide divs freely.
    -->
    <div class="hero-slide" style="background-image: url('images/hero/Image\ 41.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/Image\ 46.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_0598.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_4965.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_5068.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_5072.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_5084.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_5278.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_5292.jpeg');"></div>
    <div class="hero-slide" style="background-image: url('images/hero/IMG_9978.jpeg');"></div>



    <div class="hero-overlay"></div>

    <div class="hero-content">
      <div class="hero-eyebrow">Northwest Arkansas</div>
      <h1>Automotive<br>Photography</h1>
      <p class="hero-sub">Real Pictures. Real People. Real Machines.</p>
    </div>

    <div class="hero-indicators" id="hero-indicators"></div>
    <div class="hero-progress" id="hero-progress"></div>
  </header>

  <section class="albums-section">
    <div class="albums-eyebrow">Recent shoots</div>
    <div class="album-grid" id="album-grid"></div>
  </section>

  <footer>
    <span>© 2025 NWACar.Media</span>
    <a href="https://www.instagram.com/project.nwacar.media" target="_blank" rel="noopener">@project.nwacar.media</a>
  </footer>

  <script src="albums.js"></script>
  <script>
    /* ── Build album grid ── */
    const grid = document.getElementById("album-grid");

    Object.keys(albums).forEach((key, i) => {
      const album = albums[key];

      const imgSrc = album.hasSubfolders
        ? album.path + "grid/" + album.thumbnail
        : album.path + album.thumbnail;

      const link = document.createElement("a");
      link.href = "album.html?album=" + key;
      link.className = "album-card";
      link.innerHTML =
        '<img class="album-card-img" src="' + imgSrc + '" alt="' + album.title + '" loading="lazy">' +
        '<div class="album-card-overlay"></div>' +
        (i === 0 ? '<span class="new-badge">New</span>' : '') +
        '<div class="album-card-info">' +
          '<div class="album-card-date">' + (album.date || '') + '</div>' +
          '<div class="album-card-title">' + album.title + '</div>' +
        '</div>' +
        '<span class="album-card-arrow">→</span>';

      grid.appendChild(link);
    });

    /* ── Hero slideshow ── */
    (function () {
      const slides     = Array.from(document.querySelectorAll(".hero-slide"));
      const indicators = document.getElementById("hero-indicators");
      const progressEl = document.getElementById("hero-progress");

      if (!slides.length) return;

      const INTERVAL = 6000;
      let current    = 0;
      let startTime  = null;

      slides.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "hero-dot" + (i === 0 ? " active" : "");
        dot.addEventListener("click", () => goTo(i));
        indicators.appendChild(dot);
      });

      const dots = Array.from(indicators.querySelectorAll(".hero-dot"));

      function goTo(idx) {
        slides[current].classList.remove("active");
        dots[current].classList.remove("active");
        current = idx;
        slides[current].classList.add("active");
        dots[current].classList.add("active");
        startTime = null;
      }

      function tick(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const pct = Math.min((elapsed / INTERVAL) * 100, 100);
        progressEl.style.width = pct + "%";
        if (elapsed >= INTERVAL) goTo((current + 1) % slides.length);
        requestAnimationFrame(tick);
      }

      slides[0].classList.add("active");
      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
