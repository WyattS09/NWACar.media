<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Album</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">NWACar.Media</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
</nav>

<header class="album-header">
  <h1 id="album-title"></h1>
  <p id="album-description"></p>
</header>

<main class="photo-grid" id="photo-grid"></main>
<div id="lightbox" class="lightbox hidden">
  <span class="lightbox-close">&times;</span>
  <span id="lightbox-prev" class="lightbox-arrow">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span id="lightbox-next" class="lightbox-arrow">&#10095;</span>
</div>



<script src="albums.js"></script>

<script>
  // 1️⃣ Get album from URL
  const params = new URLSearchParams(window.location.search);
  const albumKey = params.get("album");
  const album = albums[albumKey];

  if (!album) {
    document.getElementById("album-title").textContent = "Album not found";
  } else {
    document.title = album.title;
    document.getElementById("album-title").textContent = album.title;
    document.getElementById("album-description").textContent = album.description;

    const grid = document.getElementById("photo-grid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.querySelector(".lightbox-close");
    const prevBtn = document.getElementById("lightbox-prev");
    const nextBtn = document.getElementById("lightbox-next");

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    // 2️⃣ Build photo grid
    album.photos.forEach((photo, index) => {
      const img = document.createElement("img");
      img.src = album.path + photo;
      img.alt = album.title;
      img.loading = "lazy";

      // Click opens lightbox
      img.addEventListener("click", () => {
        currentIndex = index;
        lightboxImg.src = album.path + album.photos[currentIndex];
        lightbox.classList.remove("hidden");
        document.body.classlist.add("no-scroll");
      });

      grid.appendChild(img);
    });

    // 3️⃣ Lightbox close handlers
    const closeLightbox = () => {
      lightbox.classList.add("hidden");
      lightboxImg.src = "";
    };

    closeBtn.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // 4️⃣ Arrow navigation functions
    const showPrev = () => {
      currentIndex = (currentIndex - 1 + album.photos.length) % album.photos.length;
      lightboxImg.src = album.path + album.photos[currentIndex];
    };

    const showNext = () => {
      currentIndex = (currentIndex + 1) % album.photos.length;
      lightboxImg.src = album.path + album.photos[currentIndex];
    };

    prevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      showPrev();
    });

    nextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      showNext();
    });

    // 5️⃣ Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("hidden")) return; // only respond when open
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") showPrev();
      else if (e.key === "ArrowRight") showNext();
    });

    // swiping
    // Touch start
lightbox.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

// Touch end
lightbox.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

// Swipe handler
function handleSwipe() {
  if (lightbox.classList.contains("hidden")) return;

  const swipeDistance = touchEndX - touchStartX;
  const minSwipe = 50; // minimum px to count as swipe

  if (swipeDistance > minSwipe) {
    // Swipe RIGHT → previous image
    showPrev();
  } else if (swipeDistance < -minSwipe) {
    // Swipe LEFT → next image
    showNext();
  }
}

  }
</script>



</body>
</html>
