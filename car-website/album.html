<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Album</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">NWACar.Media</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
</nav>

<header class="album-header">
  <h1 id="album-title"></h1>
  <p id="album-description"></p>
</header>

<main class="photo-grid" id="photo-grid"></main>
<div id="lightbox" class="lightbox hidden">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="albums.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const albumKey = params.get("album");
  const album = albums[albumKey];

  document.getElementById("album-title").textContent = album.title;
  document.getElementById("album-description").textContent = album.description;

  const grid = document.getElementById("photo-grid");

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const closeBtn = document.querySelector(".lightbox-close");

  album.photos.forEach(photo => {
    const img = document.createElement("img");
    img.src = album.path + photo;
    img.alt = album.title;

    img.addEventListener("click", () => {
      lightboxImg.src = img.src;
      lightbox.classList.remove("hidden");
    });

    grid.appendChild(img);
  });

  closeBtn.addEventListener("click", () => {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.classList.add("hidden");
      lightboxImg.src = "";
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      lightbox.classList.add("hidden");
      lightboxImg.src = "";
    }
  });
</script>

</body>
</html>
