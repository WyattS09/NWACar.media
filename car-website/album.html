<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Album — NWACar.Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">NWACar.Media</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="album-header">
    <h1 id="album-title"></h1>
    <p id="album-description"></p>
  </header>

  <main class="photo-grid" id="photo-grid"></main>

  <div class="load-more-wrapper">
    <button id="load-more" class="load-more">Load more</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <span id="lightbox-prev" class="lightbox-arrow">&#10094;</span>
    <img id="lightbox-img" src="" alt="">
    <span id="lightbox-next" class="lightbox-arrow">&#10095;</span>
  </div>

  <footer>
    <p>© 2025 NWACar.Media</p>
  </footer>

  <script src="albums.js"></script>
  <script>
    const BATCH_SIZE = 25;
    let loadedCount = 0;
    let currentIndex = 0;
    let touchStartX = 0;

    /* ── Get album from URL ── */
    const params   = new URLSearchParams(window.location.search);
    const albumKey = params.get("album");
    const album    = albums[albumKey];

    const grid       = document.getElementById("photo-grid");
    const lightbox   = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const loadMoreBtn = document.getElementById("load-more");

    if (!album) {
      document.getElementById("album-title").textContent = "Album not found";
      loadMoreBtn.style.display = "none";
    } else {
      document.title = `${album.title} — NWACar.Media`;
      document.getElementById("album-title").textContent = album.title;
      document.getElementById("album-description").textContent = album.description || "";

      /* ── Determine image path helper ──
         Newer albums have grid/ and full/ subfolders.
         Older albums serve photos directly from the album path.
         We detect by checking whether the album has a "grid" subfolder
         via the path convention used in albums.js. */
      function gridSrc(photo) {
        /* apr-11 and apr-8 use grid/full subfolders; older ones don't */
        const hasSubfolders = albumKey === "apr-11-drift-toge" || albumKey === "apr-8-carspot";
        return hasSubfolders ? album.path + "grid/" + photo : album.path + photo;
      }

      function fullSrc(photo) {
        const hasSubfolders = albumKey === "apr-11-drift-toge" || albumKey === "apr-8-carspot";
        return hasSubfolders ? album.path + "full/" + photo : album.path + photo;
      }

      /* ── Load photo batch ── */
      function loadMorePhotos() {
        const batch = album.photos.slice(loadedCount, loadedCount + BATCH_SIZE);

        batch.forEach((photo, i) => {
          const img = document.createElement("img");
          img.src = gridSrc(photo);
          img.alt = album.title;
          img.loading = "lazy";

          const idx = loadedCount + i;
          img.addEventListener("click", () => openLightbox(idx));
          grid.appendChild(img);
        });

        loadedCount += batch.length;

        if (loadedCount >= album.photos.length) {
          loadMoreBtn.style.display = "none";
        }
      }

      /* ── Lightbox ── */
      function openLightbox(idx) {
        currentIndex = idx;
        lightboxImg.src = fullSrc(album.photos[currentIndex]);
        lightbox.classList.remove("hidden");
        document.body.classList.add("no-scroll");
      }

      function closeLightbox() {
        lightbox.classList.add("hidden");
        lightboxImg.src = "";
        document.body.classList.remove("no-scroll");
      }

      function showPrev() {
        currentIndex = (currentIndex - 1 + album.photos.length) % album.photos.length;
        lightboxImg.src = fullSrc(album.photos[currentIndex]);
      }

      function showNext() {
        currentIndex = (currentIndex + 1) % album.photos.length;
        lightboxImg.src = fullSrc(album.photos[currentIndex]);
      }

      /* ── Event listeners ── */
      loadMoreBtn.addEventListener("click", loadMorePhotos);

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-prev").addEventListener("click", (e) => { e.stopPropagation(); showPrev(); });
      document.getElementById("lightbox-next").addEventListener("click", (e) => { e.stopPropagation(); showNext(); });

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (lightbox.classList.contains("hidden")) return;
        if (e.key === "Escape")      closeLightbox();
        if (e.key === "ArrowLeft")   showPrev();
        if (e.key === "ArrowRight")  showNext();
      });

      /* ── Touch swipe ── */
      lightbox.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) diff > 0 ? showPrev() : showNext();
      }, { passive: true });

      /* ── Initial load ── */
      loadMorePhotos();
    }
  </script>

</body>
</html>
