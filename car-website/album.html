<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Album</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">NWACar.Media</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
</nav>

<header class="album-header">
  <h1 id="album-title"></h1>
  <p id="album-description"></p>
</header>

<main class="photo-grid" id="photo-grid"></main>

<script src="albums.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const albumKey = params.get("album");
  const album = albums[albumKey];

  console.log(album); // DEBUG — leave this in for now

  if (!album) {
    document.getElementById("album-title").textContent = "Album not found";
  } else {
    document.title = album.title;
    document.getElementById("album-title").textContent = album.title;
    document.getElementById("album-description").textContent = album.description;

    const grid = document.getElementById("photo-grid");

    album.photos.forEach(photo => {
      const img = document.createElement("img");
      img.src = album.path + photo;
      img.alt = album.title;
      grid.appendChild(img);
    });
  }
</script>
<footer>
  <p>© 2025 Car Visuals</p>
</footer>

</body>
</html>
