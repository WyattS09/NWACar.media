<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Album — NWACar.Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">NWACar.Media</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="album-header">
    <a class="back-link" href="index.html">← All albums</a>
    <div class="album-header-meta" id="album-meta"></div>
    <h1 id="album-title"></h1>
    <p class="album-header-desc" id="album-description"></p>
  </header>

  <div class="photo-grid-wrap">
    <div class="photo-grid" id="photo-grid"></div>
  </div>

  <div class="load-more-wrapper">
    <button id="load-more" class="load-more">Load more</button>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <span id="lightbox-prev" class="lightbox-arrow">&#10094;</span>
    <img id="lightbox-img" src="" alt="">
    <span id="lightbox-next" class="lightbox-arrow">&#10095;</span>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <footer>
    <span>© 2025 NWACar.Media</span>
    <a href="https://www.instagram.com/project.nwacar.media" target="_blank" rel="noopener">@project.nwacar.media</a>
  </footer>

  <script src="albums.js"></script>
  <script>
    const BATCH_SIZE = 25;
    let loadedCount  = 0;
    let currentIndex = 0;
    let touchStartX  = 0;

    const params      = new URLSearchParams(window.location.search);
    const albumKey    = params.get("album");
    const album       = albums[albumKey];

    const grid        = document.getElementById("photo-grid");
    const lightbox    = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const counter     = document.getElementById("lightbox-counter");
    const loadMoreBtn = document.getElementById("load-more");

    if (!album) {
      document.getElementById("album-title").textContent = "Album not found";
      loadMoreBtn.style.display = "none";
    } else {
      document.title = album.title + " — NWACar.Media";
      document.getElementById("album-title").textContent = album.title;
      document.getElementById("album-meta").textContent  = album.date || "";

      const descEl = document.getElementById("album-description");
      if (album.description) {
        descEl.textContent = album.description;
      } else {
        descEl.style.display = "none";
      }

      /* ── Path helpers ──
         Albums with hasSubfolders:true use grid/ for thumbnails
         and full/ for lightbox. All other albums serve photos
         directly from the album path. */
      function gridSrc(photo) {
        return album.hasSubfolders
          ? album.path + "grid/" + photo
          : album.path + photo;
      }

      function fullSrc(photo) {
        return album.hasSubfolders
          ? album.path + "full/" + photo
          : album.path + photo;
      }

      /* ── Load batch ── */
      function loadMorePhotos() {
        const batch = album.photos.slice(loadedCount, loadedCount + BATCH_SIZE);

        batch.forEach(function(photo, i) {
          const img   = document.createElement("img");
          img.src     = gridSrc(photo);
          img.alt     = album.title;
          img.loading = "lazy";

          const idx = loadedCount + i;
          img.addEventListener("click", function() { openLightbox(idx); });
          grid.appendChild(img);
        });

        loadedCount += batch.length;
        if (loadedCount >= album.photos.length) {
          loadMoreBtn.style.display = "none";
        }
      }

      /* ── Counter ── */
      function updateCounter() {
        counter.textContent = (currentIndex + 1) + " / " + album.photos.length;
      }

      /* ── Lightbox ── */
      function openLightbox(idx) {
        currentIndex    = idx;
        lightboxImg.src = fullSrc(album.photos[currentIndex]);
        updateCounter();
        lightbox.classList.remove("hidden");
        document.body.classList.add("no-scroll");
      }

      function closeLightbox() {
        lightbox.classList.add("hidden");
        lightboxImg.src = "";
        document.body.classList.remove("no-scroll");
      }

      function showImage(idx) {
        currentIndex = (idx + album.photos.length) % album.photos.length;
        lightboxImg.classList.add("fading");
        setTimeout(function() {
          lightboxImg.src = fullSrc(album.photos[currentIndex]);
          updateCounter();
          lightboxImg.classList.remove("fading");
        }, 150);
      }

      function showPrev() { showImage(currentIndex - 1); }
      function showNext() { showImage(currentIndex + 1); }

      /* ── Listeners ── */
      loadMoreBtn.addEventListener("click", loadMorePhotos);

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-prev").addEventListener("click", function(e) {
        e.stopPropagation(); showPrev();
      });
      document.getElementById("lightbox-next").addEventListener("click", function(e) {
        e.stopPropagation(); showNext();
      });

      lightbox.addEventListener("click", function(e) {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", function(e) {
        if (lightbox.classList.contains("hidden")) return;
        if (e.key === "Escape")     closeLightbox();
        if (e.key === "ArrowLeft")  showPrev();
        if (e.key === "ArrowRight") showNext();
      });

      lightbox.addEventListener("touchstart", function(e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener("touchend", function(e) {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) { showPrev(); } else { showNext(); }
        }
      }, { passive: true });

      /* ── First load ── */
      loadMorePhotos();
    }
  </script>

</body>
</html>
